name: BMS Doomsday Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      debug_html:
        description: "Dump raw HTML state structure for debugging (yes/no)"
        required: false
        default: "no"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tracker (single scan)
        env:
          BMS_EMAIL_SENDER:    ${{ secrets.BMS_EMAIL_SENDER }}
          BMS_EMAIL_PASSWORD:  ${{ secrets.BMS_EMAIL_PASSWORD }}
          BMS_EMAIL_TO:        ${{ secrets.BMS_EMAIL_TO }}
          SCRAPERAPI_KEY:      ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          if [ "${{ github.event.inputs.debug_html }}" = "yes" ]; then
            python tracker.py --debug-html
          else
            python tracker.py --once
          fi

      - name: Save state back to repo
        run: |
          git config user.name  "bms-watcher[bot]"
          git config user.email "bms-watcher@users.noreply.github.com"
          git add known_theatres.json || true
          git diff --cached --quiet || git commit -m "chore: update known_theatres state [skip ci]"
          git push || true
