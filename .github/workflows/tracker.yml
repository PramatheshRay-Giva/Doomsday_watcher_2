name: BMS Doomsday Watcher

on:
  schedule:
    # Runs every 10 minutes (GitHub's minimum is 5 min)
    - cron: "*/10 * * * *"
  workflow_dispatch:   # lets you trigger manually from GitHub UI

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # kill if it hangs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch with token so we can commit state back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker (single scan)
        env:
          BMS_EMAIL_SENDER:   ${{ secrets.BMS_EMAIL_SENDER }}
          BMS_EMAIL_PASSWORD: ${{ secrets.BMS_EMAIL_PASSWORD }}
          BMS_EMAIL_TO:       ${{ secrets.BMS_EMAIL_TO }}
        run: python tracker.py --once

      # Commit updated known_theatres.json back to the repo so state
      # persists across runs (each GitHub Actions run starts fresh).
      - name: Save state back to repo
        run: |
          git config user.name  "bms-watcher[bot]"
          git config user.email "bms-watcher@users.noreply.github.com"
          git add known_theatres.json || true
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: update known_theatres state [skip ci]"
          git push || true
